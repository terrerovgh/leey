<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="South Georgia towns map style">
  <rect width="1200" height="720" fill="#f7f1e8"/>
  <rect x="48" y="48" width="1104" height="624" rx="28" fill="#fffdf9" stroke="#e2d4bc"/>
  <text x="96" y="130" font-family="Georgia, serif" font-size="40" fill="#1c1612">Pueblos que conozco de cerca</text>
  <text x="96" y="176" font-family="system-ui,sans-serif" font-size="18" fill="#6b5a4c">No es un mapa de Georgia entero. Es mi zona de trabajo.</text>
  <g font-family="system-ui,sans-serif">
    <rect x="96" y="230" width="300" height="120" rx="16" fill="#efe6d6"/>
    <text x="120" y="280" font-size="26" fill="#1c1612">Valdosta</text>
    <text x="120" y="316" font-size="16" fill="#6b5a4c">Hub · I-75 · campus</text>

    <rect x="420" y="230" width="300" height="120" rx="16" fill="#efe6d6"/>
    <text x="444" y="280" font-size="26" fill="#1c1612">Hahira · Adel</text>
    <text x="444" y="316" font-size="16" fill="#6b5a4c">Lotes amplios · ritmo calmo</text>

    <rect x="744" y="230" width="300" height="120" rx="16" fill="#efe6d6"/>
    <text x="768" y="280" font-size="26" fill="#1c1612">Tifton</text>
    <text x="768" y="316" font-size="16" fill="#6b5a4c">Universidad · familias</text>

    <rect x="96" y="380" width="300" height="120" rx="16" fill="#efe6d6"/>
    <text x="120" y="430" font-size="26" fill="#1c1612">Moultrie</text>
    <text x="120" y="466" font-size="16" fill="#6b5a4c">Stock sólido · terreno</text>

    <rect x="420" y="380" width="300" height="120" rx="16" fill="#efe6d6"/>
    <text x="444" y="430" font-size="26" fill="#1c1612">Thomasville</text>
    <text x="444" y="466" font-size="16" fill="#6b5a4c">Histórico · bungalows</text>

    <rect x="744" y="380" width="300" height="120" rx="16" fill="#efe6d6"/>
    <text x="768" y="430" font-size="26" fill="#1c1612">Nashville · Ray City</text>
    <text x="768" y="466" font-size="16" fill="#6b5a4c">Pueblo chico · terreno</text>
  </g>
  <text x="96" y="560" font-family="system-ui,sans-serif" font-size="18" fill="#3a2f27">También cruzo a Florida cuando el trato lo pide — misma licencia, mismo teléfono.</text>
  <text x="96" y="630" font-family="system-ui,sans-serif" font-size="15" fill="#8a7664">Leey Hernandez · Lock &amp; Key Realty</text>
</svg>
