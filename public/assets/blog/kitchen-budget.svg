<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Kitchen budget bars">
  <rect width="1200" height="720" fill="#f7f1e8"/>
  <rect x="48" y="48" width="1104" height="624" rx="28" fill="#fffdf9" stroke="#e2d4bc"/>
  <text x="96" y="130" font-family="Georgia, serif" font-size="38" fill="#1c1612">Dónde se va el dinero en una cocina</text>
  <text x="96" y="176" font-family="system-ui,sans-serif" font-size="18" fill="#6b5a4c">Orden aproximado cuando remodelas sin tirar paredes</text>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#3a2f27">
    <text x="96" y="250">Gabinetes / carpintería</text>
    <rect x="380" y="228" width="620" height="28" rx="8" fill="#efe6d6"/>
    <rect x="380" y="228" width="520" height="28" rx="8" fill="#c45c26"/>
    <text x="920" y="250" fill="#6b5a4c">~35%</text>

    <text x="96" y="320">Electrodomésticos</text>
    <rect x="380" y="298" width="620" height="28" rx="8" fill="#efe6d6"/>
    <rect x="380" y="298" width="310" height="28" rx="8" fill="#a34a1d"/>
    <text x="920" y="320" fill="#6b5a4c">~20%</text>

    <text x="96" y="390">Cubiertas / backsplash</text>
    <rect x="380" y="368" width="620" height="28" rx="8" fill="#efe6d6"/>
    <rect x="380" y="368" width="250" height="28" rx="8" fill="#8a6c34"/>
    <text x="920" y="390" fill="#6b5a4c">~15%</text>

    <text x="96" y="460">Piso / pintura / luz</text>
    <rect x="380" y="438" width="620" height="28" rx="8" fill="#efe6d6"/>
    <rect x="380" y="438" width="220" height="28" rx="8" fill="#4a3a2e"/>
    <text x="920" y="460" fill="#6b5a4c">~15%</text>

    <text x="96" y="530">Mano de obra / imprevistos</text>
    <rect x="380" y="508" width="620" height="28" rx="8" fill="#efe6d6"/>
    <rect x="380" y="508" width="200" height="28" rx="8" fill="#6b5a4c"/>
    <text x="920" y="530" fill="#6b5a4c">~15%</text>
  </g>
  <text x="96" y="610" font-family="system-ui,sans-serif" font-size="16" fill="#6b5a4c">Porcentajes orientativos. Cada casa miente un poco hasta que abres las paredes.</text>
  <text x="96" y="650" font-family="system-ui,sans-serif" font-size="15" fill="#8a7664">Leey · mirada de remodelación + bienes raíces</text>
</svg>
