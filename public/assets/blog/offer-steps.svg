<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Offer steps">
  <rect width="1200" height="720" fill="#f7f1e8"/>
  <rect x="48" y="48" width="1104" height="624" rx="28" fill="#2c2118"/>
  <text x="96" y="130" font-family="Georgia, serif" font-size="40" fill="#f7f1e8">Cómo armo una oferta sin prisa</text>
  <text x="96" y="176" font-family="system-ui,sans-serif" font-size="18" fill="#cbb896">Valdosta · Hahira · Adel · Tifton y alrededores</text>
  <g font-family="system-ui,sans-serif">
    <rect x="96" y="230" width="220" height="280" rx="18" fill="#3a2d23"/>
    <text x="120" y="280" font-size="14" fill="#c9a66b">PASO 1</text>
    <text x="120" y="330" font-size="24" fill="#f7f1e8">Números</text>
    <text x="120" y="370" font-size="16" fill="#cbb896">Pago, cierre,</text>
    <text x="120" y="396" font-size="16" fill="#cbb896">reparaciones</text>
    <text x="120" y="422" font-size="16" fill="#cbb896">realistas</text>

    <rect x="340" y="230" width="220" height="280" rx="18" fill="#3a2d23"/>
    <text x="364" y="280" font-size="14" fill="#c9a66b">PASO 2</text>
    <text x="364" y="330" font-size="24" fill="#f7f1e8">Comparables</text>
    <text x="364" y="370" font-size="16" fill="#cbb896">Casas parecidas</text>
    <text x="364" y="396" font-size="16" fill="#cbb896">vendidas cerca,</text>
    <text x="364" y="422" font-size="16" fill="#cbb896">no solo listados</text>

    <rect x="584" y="230" width="220" height="280" rx="18" fill="#3a2d23"/>
    <text x="608" y="280" font-size="14" fill="#c9a66b">PASO 3</text>
    <text x="608" y="330" font-size="24" fill="#f7f1e8">Inspección</text>
    <text x="608" y="370" font-size="16" fill="#cbb896">Qué pedir y</text>
    <text x="608" y="396" font-size="16" fill="#cbb896">qué dejar pasar</text>

    <rect x="828" y="230" width="220" height="280" rx="18" fill="#c45c26"/>
    <text x="852" y="280" font-size="14" fill="#faf0e8">PASO 4</text>
    <text x="852" y="330" font-size="24" fill="#fffdf9">Términos</text>
    <text x="852" y="370" font-size="16" fill="#f0d8c4">Fecha, contingencias</text>
    <text x="852" y="396" font-size="16" fill="#f0d8c4">y tono de la oferta</text>
  </g>
  <text x="96" y="580" font-family="system-ui,sans-serif" font-size="16" fill="#b5a38f">No es una fórmula mágica. Es una conversación con datos.</text>
  <text x="96" y="630" font-family="system-ui,sans-serif" font-size="15" fill="#8a7664">Leey · Lock &amp; Key Realty · leeyrealty.com</text>
</svg>
