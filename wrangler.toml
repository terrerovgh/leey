# Cloudflare Pages / Workers static assets — leeyrealty.com
name = "leey"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# SPA: serve index.html for client routes (/properties, etc.) without _redirects loops
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
