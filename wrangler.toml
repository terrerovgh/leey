# Cloudflare Workers Static Assets — leeyrealty.com
# Live: worker service `leey` bound to leeyrealty.com + www
name = "leey"
compatibility_date = "2026-07-01"
workers_dev = true

# Static pre-rendered pages: every route has a real .html file in dist/
# (home, /properties, /properties/:id, /areas/:slug). Serve those
# directly; force trailing slash so /areas/valdosta -> /areas/valdosta/index.html
[assets]
directory = "./dist"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
