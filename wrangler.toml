# Cloudflare Workers Static Assets — leeyrealty.com
# Live: worker service `leey` bound to leeyrealty.com + www
name = "leey"
compatibility_date = "2026-07-01"
workers_dev = true

# SPA: serve index.html for client routes (/properties, etc.)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
